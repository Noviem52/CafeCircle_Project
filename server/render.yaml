services:
  - type: web
    name: cafecircle-api
    runtime: python
    region: oregon
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://cafecircle.netlify.app,http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: cafecircle-db
          property: connectionString

databases:
  - name: cafecircle-db
    plan: free
    region: oregon
